name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  final-package:
    name: release/final-package
    outputs:
      tarballSha256: ${{ steps.package.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.1'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: node scripts/ci-prepare.mjs
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - name: Create and smoke the sole final package
        id: package
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --commands-only -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run lint --next npm run build --next node scripts/release-ci.mjs package --finally node scripts/leak-check.mjs --sentinels test/sentinels.json --sentinel-dir "$FLUXWARDEN_SENTINEL_DIR" "$FLUXWARDEN_FINAL_TARBALL"
      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Retain fluxwarden-final-package
        if: success() && steps.capture-verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxwarden-final-package
          path: ${{ env.FLUXWARDEN_FINAL_TARBALL }}
          if-no-files-found: error
      - name: Independently validate diagnostic receipt confidentiality
        if: always()
        id: capture-metadata
        run: node scripts/ci-safe-capture-metadata.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Retain final-package-capture
        if: always() && steps.capture-metadata.outcome == 'success' && steps.capture-metadata.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-package-capture
          path: ${{ env.FLUXWARDEN_CI_CAPTURE_DIR }}/receipt.json
          if-no-files-found: error
  inventory:
    name: inventory/${{ matrix.os }}/${{ matrix.node }}
    needs: [final-package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.23.2', '22.x', '24.18.1', '24.x', '26.5.1', '26.x']
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FLUXWARDEN_EXPECTED_TARBALL_SHA256: ${{ needs.final-package.outputs.tarballSha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '${{ matrix.node }}'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: node scripts/ci-prepare.mjs
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - name: Download the sole final package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fluxwarden-final-package
          path: ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}
      - name: Consume original final compressed package
        run: node scripts/release-ci.mjs fetch
      - name: Build exact candidate source
        run: npm run build
      - name: Independently collect all eligible source cases
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --commands-only -- node scripts/ci-install.mjs verify --root "$PWD" --next node scripts/release-ci.mjs inventory --os "${{ matrix.os }}" --node "${{ matrix.node }}"
      - name: Verify complete independent collection custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Independently scan collected inventory output
        if: always()
        id: output-verify
        run: node scripts/leak-check.mjs --sentinels test/sentinels.json --sentinel-dir "$FLUXWARDEN_SENTINEL_DIR" "$FLUXWARDEN_RELEASE_OUTPUT"
      - name: Retain fluxwarden-inventory-${{ matrix.os }}-${{ matrix.node }}
        if: success() && steps.capture-verify.outcome == 'success' && steps.output-verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxwarden-inventory-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}/inventory.json
          if-no-files-found: error
  test:
    name: platform/${{ matrix.os }}/${{ matrix.node }}/${{ matrix.shard }}
    needs: [final-package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      # Every platform reports its own result; one failure does not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.23.2', '22.x', '24.18.1', '24.x', '26.5.1', '26.x']
        shard: [product-1, product-2, harness-1, harness-2]
        include:
          - { os: windows-latest, node: '22.23.2', shard: core-1, coreShard: '1/3' }
          - { os: windows-latest, node: '22.23.2', shard: core-2, coreShard: '2/3' }
          - { os: windows-latest, node: '22.23.2', shard: core-3, coreShard: '3/3' }
          - { os: windows-latest, node: '22.23.2', shard: harness-1, harnessShard: '1/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-2, harnessShard: '2/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-3, harnessShard: '3/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-4, harnessShard: '4/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-5, harnessShard: '5/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-6, harnessShard: '6/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-7, harnessShard: '7/8' }
          - { os: windows-latest, node: '22.23.2', shard: harness-8, harnessShard: '8/8' }
          - { os: windows-latest, node: '22.23.2', shard: native-1, nativeShard: '1/2' }
          - { os: windows-latest, node: '22.23.2', shard: native-2, nativeShard: '2/2' }
          - { os: windows-latest, node: '22.x', shard: core-1, coreShard: '1/3' }
          - { os: windows-latest, node: '22.x', shard: core-2, coreShard: '2/3' }
          - { os: windows-latest, node: '22.x', shard: core-3, coreShard: '3/3' }
          - { os: windows-latest, node: '22.x', shard: harness-1, harnessShard: '1/8' }
          - { os: windows-latest, node: '22.x', shard: harness-2, harnessShard: '2/8' }
          - { os: windows-latest, node: '22.x', shard: harness-3, harnessShard: '3/8' }
          - { os: windows-latest, node: '22.x', shard: harness-4, harnessShard: '4/8' }
          - { os: windows-latest, node: '22.x', shard: harness-5, harnessShard: '5/8' }
          - { os: windows-latest, node: '22.x', shard: harness-6, harnessShard: '6/8' }
          - { os: windows-latest, node: '22.x', shard: harness-7, harnessShard: '7/8' }
          - { os: windows-latest, node: '22.x', shard: harness-8, harnessShard: '8/8' }
          - { os: windows-latest, node: '22.x', shard: native-1, nativeShard: '1/2' }
          - { os: windows-latest, node: '22.x', shard: native-2, nativeShard: '2/2' }
          - { os: windows-latest, node: '24.18.1', shard: core-1, coreShard: '1/3' }
          - { os: windows-latest, node: '24.18.1', shard: core-2, coreShard: '2/3' }
          - { os: windows-latest, node: '24.18.1', shard: core-3, coreShard: '3/3' }
          - { os: windows-latest, node: '24.18.1', shard: harness-1, harnessShard: '1/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-2, harnessShard: '2/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-3, harnessShard: '3/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-4, harnessShard: '4/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-5, harnessShard: '5/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-6, harnessShard: '6/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-7, harnessShard: '7/8' }
          - { os: windows-latest, node: '24.18.1', shard: harness-8, harnessShard: '8/8' }
          - { os: windows-latest, node: '24.18.1', shard: native-1, nativeShard: '1/2' }
          - { os: windows-latest, node: '24.18.1', shard: native-2, nativeShard: '2/2' }
          - { os: windows-latest, node: '24.x', shard: core-1, coreShard: '1/3' }
          - { os: windows-latest, node: '24.x', shard: core-2, coreShard: '2/3' }
          - { os: windows-latest, node: '24.x', shard: core-3, coreShard: '3/3' }
          - { os: windows-latest, node: '24.x', shard: harness-1, harnessShard: '1/8' }
          - { os: windows-latest, node: '24.x', shard: harness-2, harnessShard: '2/8' }
          - { os: windows-latest, node: '24.x', shard: harness-3, harnessShard: '3/8' }
          - { os: windows-latest, node: '24.x', shard: harness-4, harnessShard: '4/8' }
          - { os: windows-latest, node: '24.x', shard: harness-5, harnessShard: '5/8' }
          - { os: windows-latest, node: '24.x', shard: harness-6, harnessShard: '6/8' }
          - { os: windows-latest, node: '24.x', shard: harness-7, harnessShard: '7/8' }
          - { os: windows-latest, node: '24.x', shard: harness-8, harnessShard: '8/8' }
          - { os: windows-latest, node: '24.x', shard: native-1, nativeShard: '1/2' }
          - { os: windows-latest, node: '24.x', shard: native-2, nativeShard: '2/2' }
          - { os: windows-latest, node: '26.5.1', shard: core-1, coreShard: '1/3' }
          - { os: windows-latest, node: '26.5.1', shard: core-2, coreShard: '2/3' }
          - { os: windows-latest, node: '26.5.1', shard: core-3, coreShard: '3/3' }
          - { os: windows-latest, node: '26.5.1', shard: harness-1, harnessShard: '1/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-2, harnessShard: '2/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-3, harnessShard: '3/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-4, harnessShard: '4/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-5, harnessShard: '5/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-6, harnessShard: '6/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-7, harnessShard: '7/8' }
          - { os: windows-latest, node: '26.5.1', shard: harness-8, harnessShard: '8/8' }
          - { os: windows-latest, node: '26.5.1', shard: native-1, nativeShard: '1/2' }
          - { os: windows-latest, node: '26.5.1', shard: native-2, nativeShard: '2/2' }
          - { os: windows-latest, node: '26.x', shard: core-1, coreShard: '1/3' }
          - { os: windows-latest, node: '26.x', shard: core-2, coreShard: '2/3' }
          - { os: windows-latest, node: '26.x', shard: core-3, coreShard: '3/3' }
          - { os: windows-latest, node: '26.x', shard: harness-1, harnessShard: '1/8' }
          - { os: windows-latest, node: '26.x', shard: harness-2, harnessShard: '2/8' }
          - { os: windows-latest, node: '26.x', shard: harness-3, harnessShard: '3/8' }
          - { os: windows-latest, node: '26.x', shard: harness-4, harnessShard: '4/8' }
          - { os: windows-latest, node: '26.x', shard: harness-5, harnessShard: '5/8' }
          - { os: windows-latest, node: '26.x', shard: harness-6, harnessShard: '6/8' }
          - { os: windows-latest, node: '26.x', shard: harness-7, harnessShard: '7/8' }
          - { os: windows-latest, node: '26.x', shard: harness-8, harnessShard: '8/8' }
          - { os: windows-latest, node: '26.x', shard: native-1, nativeShard: '1/2' }
          - { os: windows-latest, node: '26.x', shard: native-2, nativeShard: '2/2' }
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FLUXWARDEN_EXPECTED_TARBALL_SHA256: ${{ needs.final-package.outputs.tarballSha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '${{ matrix.node }}'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: node scripts/ci-prepare.mjs
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - name: Download the sole final package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fluxwarden-final-package
          path: ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}
      - name: Consume original final compressed package
        run: node scripts/release-ci.mjs fetch
      - name: Validate installed final artifact on this runtime
        run: node scripts/release-smoke.mjs "$FLUXWARDEN_FINAL_TARBALL"
      - name: Run original complete shard inside capture
        if: always()
        run: node scripts/ci-platform.mjs --os "${{ matrix.os }}" --node "${{ matrix.node }}" --shard "${{ matrix.shard }}"
      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Bind actual complete report and final artifact
        id: report-seal
        if: always() && steps.capture-verify.outcome == 'success'
        run: node scripts/release-ci.mjs seal --key "platform/${{ matrix.os }}/${{ matrix.node }}/${{ matrix.shard }}"
      - name: Retain fluxwarden-platform-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
        if: always() && steps.capture-verify.outcome == 'success' && steps.report-seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxwarden-platform-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: |
            ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}/row.json
            ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}/report.json
            ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}/receipt.json
            ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}/capture.json
          if-no-files-found: error
      - name: Independently validate diagnostic receipt confidentiality
        if: always()
        id: capture-metadata
        run: node scripts/ci-safe-capture-metadata.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Retain ci-capture-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
        if: always() && steps.capture-metadata.outcome == 'success' && steps.capture-metadata.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-capture-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ env.FLUXWARDEN_CI_CAPTURE_DIR }}/receipt.json
          if-no-files-found: error
  lab:
    name: live/lab
    needs: [final-package]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FLUXWARDEN_EXPECTED_TARBALL_SHA256: ${{ needs.final-package.outputs.tarballSha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.1'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: node scripts/ci-prepare.mjs
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - name: Download the sole final package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fluxwarden-final-package
          path: ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}
      - name: Consume original final compressed package
        run: node scripts/release-ci.mjs fetch
      - name: Build exact candidate source
        run: npm run build
      - name: Prepare exclusively owned disposable live inputs
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ env.TEMP }}
        run: node scripts/release-live.mjs prepare
      - name: Measure independent CP010 smoke invocation for R6
        run: node scripts/release-live.mjs measure
      - name: Run complete required live selection
        if: always()
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --commands-only -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run build --next npm run test:lab -- --reporter=default --reporter=json --outputFile.json "$FLUXWARDEN_EVIDENCE_DIR/vitest-lab.json" --next node scripts/no-pending.mjs "$FLUXWARDEN_EVIDENCE_DIR/vitest-lab.json"
      - name: Remove exclusively owned disposable live resources
        if: always()
        run: node scripts/release-live.mjs down
      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Bind complete actual live report
        id: report-seal
        if: always() && steps.capture-verify.outcome == 'success'
        run: node scripts/release-ci.mjs seal --key live/lab
      - name: Retain fluxwarden-live-lab
        if: always() && steps.capture-verify.outcome == 'success' && steps.report-seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxwarden-live-lab
          path: |
            ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}/*.json
          if-no-files-found: error
      - name: Independently validate diagnostic receipt confidentiality
        if: always()
        id: capture-metadata
        run: node scripts/ci-safe-capture-metadata.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Retain lab-capture
        if: always() && steps.capture-metadata.outcome == 'success' && steps.capture-metadata.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-capture
          path: ${{ env.FLUXWARDEN_CI_CAPTURE_DIR }}/receipt.json
          if-no-files-found: error
  chaos:
    name: live/chaos
    needs: [final-package]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FLUXWARDEN_EXPECTED_TARBALL_SHA256: ${{ needs.final-package.outputs.tarballSha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.1'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: node scripts/ci-prepare.mjs
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - name: Download the sole final package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fluxwarden-final-package
          path: ${{ env.FLUXWARDEN_RELEASE_OUTPUT }}
      - name: Consume original final compressed package
        run: node scripts/release-ci.mjs fetch
      - name: Build exact candidate source
        run: npm run build
      - name: Prepare exclusively owned disposable live inputs
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ env.TEMP }}
        run: node scripts/release-live.mjs prepare
      - name: Run complete required live selection
        if: always()
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --commands-only -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run build --next npm run test:chaos -- --reporter=default --reporter=json --outputFile.json "$FLUXWARDEN_EVIDENCE_DIR/vitest-chaos.json" --next node scripts/no-pending.mjs "$FLUXWARDEN_EVIDENCE_DIR/vitest-chaos.json" --finally node scripts/leak-check.mjs --sentinels test/sentinels.json --sentinel-dir "$FLUXWARDEN_SENTINEL_DIR" "$FLUXWARDEN_EVIDENCE_DIR"
      - name: Remove exclusively owned disposable live resources
        if: always()
        run: node scripts/release-live.mjs down
      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Bind complete actual live report
        id: report-seal
        if: always() && steps.capture-verify.outcome == 'success'
        run: node scripts/release-ci.mjs seal --key live/chaos
