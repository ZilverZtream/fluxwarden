name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request or feature branch cancels the run it supersedes;
# every run on main completes, so each main commit keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every platform reports its own result; one failure does not cancel the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.23.2', '22.x', '24.18.1', '24.x']
        shard: [core]
        include:
          - { os: windows-latest, node: '22.23.2', shard: core-1, coreShard: '1/2' }
          - { os: windows-latest, node: '22.23.2', shard: core-2, coreShard: '2/2' }
          - { os: windows-latest, node: '22.23.2', shard: native }
          - { os: windows-latest, node: '24.x', shard: core-1, coreShard: '1/2' }
          - { os: windows-latest, node: '24.x', shard: core-2, coreShard: '2/2' }
          - { os: windows-latest, node: '24.x', shard: native }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from 'node:fs/promises';
          import { win32, join } from 'node:path';
          import { createPrivateDirectory, assertPrivateDirectories, realDirectory } from './scripts/private-scratch.mjs';
          let parent = process.env.FLUXWARDEN_CI_TMP_PARENT;
          if (process.platform === 'win32') {
            // Hosted temp drives and runner profiles can have mutable or foreign-owned ancestors.
            // Avoid both: restrict only a unique directory we create directly on the OS drive.
            const systemRoot = process.env.SystemRoot;
            if (!systemRoot || !/^[A-Za-z]:\\Windows$/i.test(systemRoot)) throw new Error('a Windows system directory on an absolute drive is required');
            const drive = win32.parse(systemRoot).root;
            await realDirectory(systemRoot);
            await realDirectory(drive);
            parent = await createPrivateDirectory(drive, 'fluxwarden-ci-');
          }
          const roots = [];
          for (const [name, prefix] of [['TEMP', 'ci-temp-'], ['TMP', 'ci-tmp-'], ['FLUXWARDEN_TEST_TMP', 'ci-tests-'], ['FLUXWARDEN_SENTINEL_DIR', 'ci-sentinels-'], ['FLUXWARDEN_EVIDENCE_DIR', 'ci-evidence-'], ['FLUXWARDEN_CI_CAPTURE_DIR', 'ci-capture-']]) {
            roots.push([name, await createPrivateDirectory(parent, prefix)]);
          }
          await assertPrivateDirectories([...(process.platform === 'win32' ? [parent] : []), ...roots.map(([, directory]) => directory)]);
          const temp = roots.find(([name]) => name === 'TEMP')[1], evidence = roots.find(([name]) => name === 'FLUXWARDEN_EVIDENCE_DIR')[1];
          for (const [name, filename] of [['NPM_CONFIG_USERCONFIG', 'npm-user.npmrc'], ['NPM_CONFIG_GLOBALCONFIG', 'npm-global.npmrc']]) {
            const path = join(temp, filename); await writeFile(path, '', { flag: 'wx', mode: 0o600 }); roots.push([name, path]);
          }
          roots.push(['NPM_CONFIG_CACHE', await createPrivateDirectory(temp, 'npm-validation-cache-')], ['NPM_CONFIG_LOGS_DIR', await createPrivateDirectory(evidence, 'npm-validation-logs-')], ['NPM_CONFIG_UPDATE_NOTIFIER', 'false']);
          await appendFile(process.env.GITHUB_ENV, [
            ...(process.platform === 'win32' ? [['FLUXWARDEN_CI_OWNED_ROOT', parent]] : []), ...roots,
          ].map(([name, directory]) => `${name}=${directory}\n`).join(''));
          NODE
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      # The hosted Linux runners have two CPUs; four workers contend in timing-bound proofs.
      - name: Test Linux product
        if: always() && matrix.os == 'ubuntu-latest' && matrix.shard == 'core'
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --harness -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run lint --next npm run build --next node scripts/ci-database-check.mjs --next npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile.json="$FLUXWARDEN_EVIDENCE_DIR/vitest-product.json"
      # Separate Windows VMs keep native process and owner-lifecycle proofs from competing with core tests.
      - name: Test Windows core product
        env:
          FLUXWARDEN_CI_CORE_CONFIG: ${{ env.TEMP }}/vitest-windows-core.config.mjs
        if: always() && matrix.os == 'windows-latest' && startsWith(matrix.shard, 'core-')
        run: >-
          node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs ${{ matrix.shard == 'core-1' && '--harness' || '' }} -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run lint --next npm run build --next node scripts/ci-database-check.mjs --next node scripts/ci-windows-core.mjs --next npm test -- --config="$FLUXWARDEN_CI_CORE_CONFIG" --maxWorkers=1 --fileParallelism=false
          --shard=${{ matrix.coreShard }}
          --reporter=default --reporter=json --outputFile.json="$FLUXWARDEN_EVIDENCE_DIR/vitest-product.json"
      - name: Test Windows native product
        if: always() && matrix.os == 'windows-latest' && matrix.shard == 'native'
        run: >-
          node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run lint --next npm run build --next node scripts/ci-database-check.mjs --next npm test -- --maxWorkers=1 --fileParallelism=false
          test/labs/cp006-cp008-owner-lifecycle.test.ts
          test/persistence/cp015-concurrency.test.ts
          test/chaos/t01-t12.test.ts
          test/cli/cp038-reconcile-evidence.test.ts
          test/commands/cp043-driver.test.ts
          test/executor/cp029-preflight.test.ts
          test/output/cp003-output.test.ts
          test/persistence/cp015-command-data-readonly.test.ts
          test/persistence/cp015-persistence.test.ts
          test/daemon/cp041-daemon.test.ts
          test/ledger/cp037-ledger.test.ts
          test/commands/cp043-t05-repository.test.ts
          --reporter=default --reporter=json --outputFile.json="$FLUXWARDEN_EVIDENCE_DIR/vitest-product.json"
      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Upload verified safe capture
        if: always() && steps.capture-verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-capture-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: |
            ${{ env.FLUXWARDEN_CI_CAPTURE_DIR }}/receipt.json
          if-no-files-found: error
  # The regtest lab and chaos runs: Linux only, started by hand, never a test loop.
  lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createPrivateDirectory, assertPrivateDirectories } from './scripts/private-scratch.mjs';
          const roots = [];
          for (const name of ['TEMP', 'TMP', 'FLUXWARDEN_TEST_TMP', 'FLUXWARDEN_SENTINEL_DIR', 'FLUXWARDEN_EVIDENCE_DIR', 'FLUXWARDEN_CI_CAPTURE_DIR']) roots.push([name, await createPrivateDirectory(process.env.FLUXWARDEN_CI_TMP_PARENT, 'lab-' + name.toLowerCase() + '-')]);
          await assertPrivateDirectories(roots.map(([, path]) => path));
          const temp = roots.find(([name]) => name === 'TEMP')[1], evidence = roots.find(([name]) => name === 'FLUXWARDEN_EVIDENCE_DIR')[1];
          for (const [name, filename] of [['NPM_CONFIG_USERCONFIG', 'npm-user.npmrc'], ['NPM_CONFIG_GLOBALCONFIG', 'npm-global.npmrc']]) {
            const path = join(temp, filename); await writeFile(path, '', { flag: 'wx', mode: 0o600 }); roots.push([name, path]);
          }
          roots.push(['NPM_CONFIG_CACHE', await createPrivateDirectory(temp, 'npm-validation-cache-')], ['NPM_CONFIG_LOGS_DIR', await createPrivateDirectory(evidence, 'npm-validation-logs-')], ['NPM_CONFIG_UPDATE_NOTIFIER', 'false']);
          await appendFile(process.env.GITHUB_ENV, roots.map(([name, path]) => name + '=' + path + '\n').join(''));
          NODE
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - if: always()
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --commands-only -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run build --next npm run test:lab
      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Upload verified safe capture
        if: always() && steps.capture-verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-capture
          path: |
            ${{ env.FLUXWARDEN_CI_CAPTURE_DIR }}/receipt.json
          if-no-files-found: error

  chaos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.2'
      - name: Prepare private test directories
        env:
          FLUXWARDEN_CI_TMP_PARENT: ${{ runner.temp }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createPrivateDirectory, assertPrivateDirectories } from './scripts/private-scratch.mjs';
          const roots = [];
          for (const name of ['TEMP', 'TMP', 'FLUXWARDEN_TEST_TMP', 'FLUXWARDEN_SENTINEL_DIR', 'FLUXWARDEN_EVIDENCE_DIR', 'FLUXWARDEN_CI_CAPTURE_DIR']) roots.push([name, await createPrivateDirectory(process.env.FLUXWARDEN_CI_TMP_PARENT, 'chaos-' + name.toLowerCase() + '-')]);
          await assertPrivateDirectories(roots.map(([, path]) => path));
          const temp = roots.find(([name]) => name === 'TEMP')[1], evidence = roots.find(([name]) => name === 'FLUXWARDEN_EVIDENCE_DIR')[1];
          for (const [name, filename] of [['NPM_CONFIG_USERCONFIG', 'npm-user.npmrc'], ['NPM_CONFIG_GLOBALCONFIG', 'npm-global.npmrc']]) {
            const path = join(temp, filename); await writeFile(path, '', { flag: 'wx', mode: 0o600 }); roots.push([name, path]);
          }
          roots.push(['NPM_CONFIG_CACHE', await createPrivateDirectory(temp, 'npm-validation-cache-')], ['NPM_CONFIG_LOGS_DIR', await createPrivateDirectory(evidence, 'npm-validation-logs-')], ['NPM_CONFIG_UPDATE_NOTIFIER', 'false']);
          await appendFile(process.env.GITHUB_ENV, roots.map(([name, path]) => name + '=' + path + '\n').join(''));
          NODE
      - name: Install locked toolchain without lifecycle scripts
        run: node scripts/ci-install.mjs --root "$PWD"
      - if: always()
        run: node scripts/ci-capture.mjs --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR" -- node scripts/ci-job.mjs --commands-only -- node scripts/ci-install.mjs verify --root "$PWD" --next npm run build --next npm run test:chaos -- --reporter=default --reporter=json --outputFile.json "$FLUXWARDEN_EVIDENCE_DIR/vitest-chaos.json" --finally node scripts/leak-check.mjs --sentinels test/sentinels.json --sentinel-dir "$FLUXWARDEN_SENTINEL_DIR" "$FLUXWARDEN_EVIDENCE_DIR"

      - name: Verify complete invocation custody
        if: always()
        id: capture-verify
        run: node scripts/ci-capture.mjs verify --root "$PWD" --capture-dir "$FLUXWARDEN_CI_CAPTURE_DIR"
      - name: Upload scanned evidence
        if: always() && steps.capture-verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chaos-evidence
          path: ${{ env.FLUXWARDEN_EVIDENCE_DIR }}
          if-no-files-found: error
      - name: Upload verified safe capture
        if: always() && steps.capture-verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chaos-capture
          path: |
            ${{ env.FLUXWARDEN_CI_CAPTURE_DIR }}/receipt.json
          if-no-files-found: error
